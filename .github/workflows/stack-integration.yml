name: Stack Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stack-integration.yml"
      - "integration/stack/**"
      - ".terraform-version"
      - "**/*.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

env:
  TF_TOKEN_APP_TERRAFORM_IO: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
  TFC_AGENT_TOKEN: ${{ secrets.TFC_AGENT_TOKEN }}
  TFC_ORGANIZATION: amiasea-development
  TFC_PROJECT_NAME: github-actions-integration
  TFC_STACK_NAME: azsqlaccess-integration
  TFC_AGENT_POOL_ID: ${{ secrets.TFC_AGENT_POOL_ID }}
  TFC_VARSET_NAME: github-actions-integration
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_DATABASE_HOST: ${{ vars.AZURE_DATABASE_HOST }}
  AZURE_DATABASE_NAME: ${{ vars.AZURE_DATABASE_NAME }}
  ENTRA_GROUP_DISPLAY_NAME: ${{ vars.ENTRA_GROUP_DISPLAY_NAME }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      tfc-agent:
        image: hashicorp/tfc-agent:latest
        env:
          TFC_AGENT_TOKEN: ${{ secrets.TFC_AGENT_TOKEN }}
          TF_TOKEN_APP_TERRAFORM_IO: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          cli_config_credentials_token: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

      - name: Verify Terraform version
        shell: bash
        run: |
          set -euo pipefail
          terraform version
          terraform version | grep -F 'Terraform v1.16.2'

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .terraform-version ]]; then
            echo "::error file=.terraform-version::Required file .terraform-version does not exist."
            exit 1
          fi

          if [[ ! -f integration/stack/main.tfdeploy.hcl ]]; then
            echo "::error file=integration/stack/main.tfdeploy.hcl::Required Stack configuration file does not exist."
            exit 1
          fi

          configured_version="$(tr -d '[:space:]' < .terraform-version)"

          if [[ "$configured_version" != "1.16.2" ]]; then
            echo "::error file=.terraform-version::Expected Terraform version 1.16.2, but found '${configured_version}'."
            exit 1
          fi

          required_vars=(
            TF_TOKEN_APP_TERRAFORM_IO
            TFC_AGENT_TOKEN
            TFC_AGENT_POOL_ID
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_DATABASE_HOST
            AZURE_DATABASE_NAME
            ENTRA_GROUP_DISPLAY_NAME
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "::error::Required environment variable '${var_name}' is missing or empty."
              exit 1
            fi
          done

          echo "All workflow input validations passed."
          echo "Terraform version: ${configured_version}"
          echo "Required files and environment variables are present."

      - name: Install API tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Upsert HCP Terraform Project, Stack, and Variable Set
        id: upsert
        shell: bash
        env:
          TFC_API: https://app.terraform.io/api/v2
        run: |
          set -euo pipefail

          : "${TF_TOKEN_APP_TERRAFORM_IO:?Missing HCP Terraform API token}"
          : "${TFC_AGENT_POOL_ID:?Missing HCP Terraform agent pool ID}"

          api() {
            local method="GET"
            local arg=""
            local previous=""
            local url="${@: -1}"
            local response_file
            local status

            for arg in "$@"; do
              if [[ "$previous" == "--request" ]]; then
                method="$arg"
              elif [[ "$arg" == "--data" || "$arg" == "--data-raw" || "$arg" == "--data-binary" ]]; then
                if [[ "$method" == "GET" ]]; then
                  method="POST"
                fi
              fi
              previous="$arg"
            done

            echo "::group::HCP API ${method} ${url}" >&2
            response_file="$(mktemp)"

            if ! status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${TF_TOKEN_APP_TERRAFORM_IO}" \
              --header "Content-Type: application/vnd.api+json" \
              "$@")"; then
              echo "::error::HCP API transport failure: ${method} ${url}" >&2
              cat "$response_file" >&2 || true
              rm -f "$response_file"
              echo "::endgroup::" >&2
              return 1
            fi

            echo "HTTP status: ${status}" >&2

            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "::error::HCP API request failed: ${method} ${url}" >&2
              cat "$response_file" >&2
              rm -f "$response_file"
              echo "::endgroup::" >&2
              return 22
            fi

            cat "$response_file"
            rm -f "$response_file"
            echo "::endgroup::" >&2
          }

          echo "Upsert stage: find or create Project"

          projects="$(api \
            "${TFC_API}/organizations/${TFC_ORGANIZATION}/projects?page%5Bsize%5D=100")"

          project_id="$(jq -r \
            --arg name "$TFC_PROJECT_NAME" \
            '[.data[]? | select(.attributes.name == $name) | .id][0] // empty' \
            <<< "$projects")"

          if [[ -z "$project_id" ]]; then
            project_payload="$(jq -n \
              --arg name "$TFC_PROJECT_NAME" \
              '{
                data: {
                  type: "projects",
                  attributes: {
                    name: $name,
                    description: "GitHub Actions provider integration tests"
                  }
                }
              }')"

            project="$(api --request POST \
              --data "$project_payload" \
              "${TFC_API}/organizations/${TFC_ORGANIZATION}/projects")"

            project_id="$(jq -r '.data.id // empty' <<< "$project")"
          else
            echo "Found Project: ${TFC_PROJECT_NAME}"
          fi

          test -n "$project_id"
          test "$project_id" != "null"
          echo "Project ID: ${project_id}"

          echo "Upsert stage: find or create Stack"

          stacks="$(api \
            "${TFC_API}/organizations/${TFC_ORGANIZATION}/stacks?page%5Bsize%5D=100")"

          stack_id="$(jq -r \
            --arg name "$TFC_STACK_NAME" \
            --arg project "$project_id" \
            '[.data[]?
              | select(.attributes.name == $name)
              | select(.relationships.project.data.id == $project)
              | .id][0] // empty' <<< "$stacks")"

          stack_payload="$(jq -n \
            --arg name "$TFC_STACK_NAME" \
            --arg project "$project_id" \
            --arg pool "$TFC_AGENT_POOL_ID" \
            '{
              data: {
                type: "stacks",
                attributes: {
                  name: $name,
                  description: "Custom azsqlaccess provider integration test",
                  "execution-mode": "agent",
                  "setting-overwrites": {
                    "execution-mode": true,
                    "agent-pool": true
                  },
                  "trigger-disabled": false,
                  "speculative-enabled": false
                },
                relationships: {
                  project: {
                    data: {type: "projects", id: $project}
                  },
                  "agent-pool": {
                    data: {type: "agent-pools", id: $pool}
                  }
                }
              }
            }')"

          if [[ -z "$stack_id" ]]; then
            stack="$(api --request POST \
              --data "$stack_payload" \
              "${TFC_API}/stacks")"

            stack_id="$(jq -r '.data.id // empty' <<< "$stack")"
          else
            api --request PATCH \
              --data "$stack_payload" \
              "${TFC_API}/stacks/${stack_id}" >/dev/null
          fi

          test -n "$stack_id"
          test "$stack_id" != "null"
          echo "Stack ID: ${stack_id}"

          echo "Upsert stage: find or create Project variable set"

          project_varsets="$(api \
            "${TFC_API}/projects/${project_id}/varsets?page%5Bsize%5D=100")"

          varset_id="$(jq -r \
            --arg name "$TFC_VARSET_NAME" \
            '[.data[]?
              | select(.attributes.name == $name)
              | .id][0] // empty' <<< "$project_varsets")"

          if [[ -z "$varset_id" ]]; then
            org_varsets="$(api \
              "${TFC_API}/organizations/${TFC_ORGANIZATION}/varsets?page%5Bsize%5D=100")"

            varset_id="$(jq -r \
              --arg name "$TFC_VARSET_NAME" \
              '[.data[]?
                | select(.attributes.name == $name)
                | .id][0] // empty' <<< "$org_varsets")"

            if [[ -n "$varset_id" ]]; then
              association_payload="$(jq -n \
                --arg project "$project_id" \
                '{
                  data: [{type: "projects", id: $project}]
                }')"

              api --request POST \
                --data "$association_payload" \
                "${TFC_API}/varsets/${varset_id}/relationships/projects" \
                >/dev/null
            else
              varset_payload="$(jq -n \
                --arg name "$TFC_VARSET_NAME" \
                --arg project "$project_id" \
                '{
                  data: {
                    type: "varsets",
                    attributes: {
                      name: $name,
                      description: "Repository variables for provider integration tests",
                      global: false,
                      priority: false
                    },
                    relationships: {
                      parent: {
                        data: {type: "projects", id: $project}
                      }
                    }
                  }
                }')"

              varset="$(api --request POST \
                --data "$varset_payload" \
                "${TFC_API}/organizations/${TFC_ORGANIZATION}/varsets")"

              varset_id="$(jq -r '.data.id // empty' <<< "$varset")"
            fi
          fi

          test -n "$varset_id"
          test "$varset_id" != "null"
          echo "Variable set ID: ${varset_id}"

          sync_var() {
            local key="$1"
            local value="$2"
            local vars_response
            local var_id
            local payload

            vars_response="$(api \
              "${TFC_API}/varsets/${varset_id}/relationships/vars?page%5Bsize%5D=100")"

            var_id="$(jq -r \
              --arg key "$key" \
              '[.data[]?
                | select(.attributes.key == $key)
                | .id][0] // empty' <<< "$vars_response")"

            payload="$(jq -n \
              --arg key "$key" \
              --arg value "$value" \
              '{
                data: {
                  type: "vars",
                  attributes: {
                    key: $key,
                    value: $value,
                    category: "terraform",
                    hcl: false,
                    sensitive: false
                  }
                }
              }')"

            if [[ -n "$var_id" ]]; then
              api --request PATCH \
                --data "$payload" \
                "${TFC_API}/varsets/${varset_id}/relationships/vars/${var_id}" \
                >/dev/null
              echo "Updated variable: ${key}"
            else
              api --request POST \
                --data "$payload" \
                "${TFC_API}/varsets/${varset_id}/relationships/vars" \
                >/dev/null
              echo "Created variable: ${key}"
            fi
          }

          sync_var azure_tenant_id "$AZURE_TENANT_ID"
          sync_var azure_client_id "$AZURE_CLIENT_ID"
          sync_var azure_subscription_id "$AZURE_SUBSCRIPTION_ID"
          sync_var azure_database_host "$AZURE_DATABASE_HOST"
          sync_var azure_database_name "$AZURE_DATABASE_NAME"
          sync_var entra_group_display_name "$ENTRA_GROUP_DISPLAY_NAME"

          echo "TFC_PROJECT_ID=${project_id}" >> "$GITHUB_ENV"
          echo "TFC_STACK_ID=${stack_id}" >> "$GITHUB_ENV"
          echo "TFC_VARSET_ID=${varset_id}" >> "$GITHUB_ENV"

          stack_url="https://app.terraform.io/app/${TFC_ORGANIZATION}/stacks/${stack_id}"
          echo "stack_url=${stack_url}" >> "$GITHUB_OUTPUT"
          echo "Stack URL: ${stack_url}"

      - name: Initialize Stack configuration
        working-directory: integration/stack
        shell: bash
        run: |
          set -euo pipefail

          echo "Terraform version:"
          terraform version

          echo "Initializing Stack configuration and downloading dependencies..."
          terraform stacks init

          echo "Initialization completed."
          echo "Stack dependency directory:"
          if [[ -d .terraform/modules ]]; then
            find .terraform/modules -maxdepth 2 -type d -print
          else
            echo "No .terraform/modules directory was created."
          fi

      - name: Validate Stack configuration
        working-directory: integration/stack
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Stack configuration..."
          terraform stacks validate

          echo "Stack configuration validation succeeded."

      - name: Upload Stack configuration
        working-directory: integration/stack
        shell: bash
        run: |
          set -euo pipefail

          : "${TFC_STACK_ID:?Missing Stack ID from upsert step}"
          : "${TF_TOKEN_APP_TERRAFORM_IO:?Missing HCP Terraform API token}"

          echo "Terraform version:"
          terraform version

          echo "Uploading validated Stack configuration"
          echo "Organization: ${TFC_ORGANIZATION}"
          echo "Project: ${TFC_PROJECT_NAME}"
          echo "Stack: ${TFC_STACK_NAME}"
          echo "Stack ID: ${TFC_STACK_ID}"
          echo "Configuration directory: ${PWD}"

          terraform stacks configuration upload \
            -stack-id "$TFC_STACK_ID"

          echo "Stack configuration upload command completed."
          echo "Stack URL: ${{ steps.upsert.outputs.stack_url }}"