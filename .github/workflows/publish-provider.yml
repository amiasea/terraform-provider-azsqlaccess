name: Publish Provider

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-provider-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_ORG: amiasea-development
  PROVIDER_NAME: azsqlaccess

jobs:
  publish:
    name: Publish azsqlaccess provider
    runs-on: ubuntu-latest

    steps:
      - name: Validate semantic version tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable semantic version tag such as v1.2.3; got '$TAG'."
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.HCP_PROVIDER_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Missing HCP_PROVIDER_GPG_PRIVATE_KEY repository secret."
            exit 1
          fi

          printf '%s' "$GPG_PRIVATE_KEY" |
            gpg --batch --import

          # HCP Terraform expects the registered key ID, not its full fingerprint.
          GPG_KEY_ID="$(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "sec" { print $5; exit }'
          )"

          if [[ "$GPG_KEY_ID" != "FA67D7FC943D1A35" ]]; then
            echo "::error::Imported GPG key ID '$GPG_KEY_ID' does not match the registered key FA67D7FC943D1A35."
            exit 1
          fi

          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          echo "Imported registered GPG signing key."

      - name: Build Linux AMD64 provider
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/terraform-provider-${PROVIDER_NAME}_v${VERSION}" \
              .

          file "dist/terraform-provider-${PROVIDER_NAME}_v${VERSION}"

      - name: Package provider and sign checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GPG_PASSPHRASE: ${{ secrets.HCP_PROVIDER_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          PACKAGE="terraform-provider-${PROVIDER_NAME}_${VERSION}_linux_amd64.zip"
          BINARY="terraform-provider-${PROVIDER_NAME}_v${VERSION}"

          (
            cd dist

            zip "$PACKAGE" "$BINARY"
            sha256sum "$PACKAGE" > SHA256SUMS

            gpg --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEY_ID" \
              --detach-sign \
              --output SHA256SUMS.sig \
              SHA256SUMS

            echo "Generated package and signed checksum manifest:"
            cat SHA256SUMS
          )

      - name: Register provider and publish version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TF_TOKEN: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: |
          set -euo pipefail

          if [[ -z "$TF_TOKEN" ]]; then
            echo "::error::Missing TF_TOKEN_APP_TERRAFORM_IO repository secret."
            exit 1
          fi

          API="https://app.terraform.io/api/v2"
          PROVIDERS_URL="$API/organizations/$TF_ORG/registry-providers"
          BASE="$PROVIDERS_URL/private/$TF_ORG/$PROVIDER_NAME"

          api() {
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $TF_TOKEN" \
              --header "Content-Type: application/vnd.api+json" \
              "$@"
          }

          # Create the private provider record if it does not exist.
          if api "$BASE" >/dev/null 2>&1; then
            echo "Provider record already exists: $TF_ORG/$PROVIDER_NAME"
          else
            echo "Creating private provider record: $TF_ORG/$PROVIDER_NAME"

            api --request POST \
              --data "$(
                jq -n \
                  --arg name "$PROVIDER_NAME" \
                  --arg namespace "$TF_ORG" \
                  '{
                    data: {
                      type: "registry-providers",
                      attributes: {
                        name: $name,
                        namespace: $namespace,
                        "registry-name": "private"
                      }
                    }
                  }'
              )" \
              "$PROVIDERS_URL" || {
                echo "::error::Could not create provider record. Check the token, organization, and Owners-team permissions."
                exit 1
              }
          fi

          # Never overwrite an existing version.
          if api "$BASE/versions/$VERSION" >/dev/null 2>&1; then
            echo "::error::Version $VERSION already exists for $TF_ORG/$PROVIDER_NAME. Refusing to overwrite it."
            exit 1
          fi

          echo "Creating provider version $VERSION"

          VERSION_RESPONSE="$(
            api --request POST \
              --data "$(
                jq -n \
                  --arg version "$VERSION" \
                  --arg key "$GPG_KEY_ID" \
                  '{
                    data: {
                      type: "registry-provider-versions",
                      attributes: {
                        version: $version,
                        "key-id": $key,
                        protocols: ["5.0", "6.0"]
                      }
                    }
                  }'
              )" \
              "$BASE/versions"
          )"

          SHASUMS_URL="$(
            jq -er '.data.links["shasums-upload"]' <<< "$VERSION_RESPONSE"
          )"

          SIGNATURE_URL="$(
            jq -er '.data.links["shasums-sig-upload"]' <<< "$VERSION_RESPONSE"
          )"

          # Upload the checksum manifest and its GPG signature.
          curl --silent --show-error --fail-with-body \
            --request PUT \
            --upload-file dist/SHA256SUMS \
            "$SHASUMS_URL"

          curl --silent --show-error --fail-with-body \
            --request PUT \
            --upload-file dist/SHA256SUMS.sig \
            "$SIGNATURE_URL"

          PACKAGE="terraform-provider-${PROVIDER_NAME}_${VERSION}_linux_amd64.zip"
          SHASUM="$(awk '{print $1}' dist/SHA256SUMS)"

          # Register the Linux AMD64 platform.
          PLATFORM_RESPONSE="$(
            api --request POST \
              --data "$(
                jq -n \
                  --arg checksum "$SHASUM" \
                  --arg filename "$PACKAGE" \
                  '{
                    data: {
                      type: "registry-provider-platforms",
                      attributes: {
                        os: "linux",
                        arch: "amd64",
                        shasum: $checksum,
                        filename: $filename
                      }
                    }
                  }'
              )" \
              "$BASE/versions/$VERSION/platforms"
          )"

          BINARY_URL="$(
            jq -er '.data.links["provider-binary-upload"]' \
              <<< "$PLATFORM_RESPONSE"
          )"

          # Upload the provider archive.
          curl --silent --show-error --fail-with-body \
            --request PUT \
            --upload-file "dist/$PACKAGE" \
            "$BINARY_URL"

          echo "Uploaded $TF_ORG/$PROVIDER_NAME v$VERSION (linux_amd64)."

      - name: Verify published platform
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TF_TOKEN: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: |
          set -euo pipefail

          URL="https://app.terraform.io/api/v2/organizations/$TF_ORG/registry-providers/private/$TF_ORG/$PROVIDER_NAME/versions/$VERSION/platforms/linux/amd64"

          RESPONSE="$(
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $TF_TOKEN" \
              --header "Content-Type: application/vnd.api+json" \
              "$URL"
          )"

          jq '{
            os: .data.attributes.os,
            arch: .data.attributes.arch,
            filename: .data.attributes.filename,
            provider_binary_uploaded: .data.attributes["provider-binary-uploaded"]
          }' <<< "$RESPONSE"

          if [[ "$(jq -r '.data.attributes["provider-binary-uploaded"]' <<< "$RESPONSE")" != "true" ]]; then
            echo "::error::HCP Terraform did not confirm the provider binary upload."
            exit 1
          fi

          echo "Verified published provider $TF_ORG/$PROVIDER_NAME v$VERSION."